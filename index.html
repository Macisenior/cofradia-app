<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com; script-src-attr 'none'; connect-src 'self' https://*.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://cofradia-app-28829.firebaseapp.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Cofradía</title>

  <link rel="stylesheet" href="styles.css">

  <!-- PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous"></script>
</head>

<body>

  <h1>Importar personas</h1>

  <!-- 🔐 AUTH -->
  <div class="auth">
    <button id="btnLogin">🔐 Iniciar sesión</button>
    <button id="btnLogout" style="display:none">🚪 Salir</button>
  </div>
  <div id="authStatus" role="status" aria-live="polite">🔒 Inicia sesión con la cuenta autorizada para acceder.</div>

  <div id="adminControls" style="display:none">
  <!-- 📁 CSV -->
  <input type="file" id="csvFile" accept=".csv" style="display:none">

  <button id="btnElegirCsv" class="btn-archivo">
    📁 Elegir CSV
  </button>

  <button id="btnImportarCsv" class="btn-importar">⬆️ Importar</button>

  <!-- 🔍 BUSCADOR -->
 <div class="buscador-wrapper">
  <div class="buscador-container">
    <span class="icono">🔍</span>

    <input 
      type="text" 
      id="buscador" 
      placeholder="Buscar por nombre, dirección..."
    />
  </div>

  <button id="btnLimpiarBusqueda" class="btn-limpiar">
    ❌ Limpiar
  </button>
</div>
  <hr>

  <!-- 📊 RESUMEN -->
  <div id="resumen" class="resumen"></div>

  <!-- ➕ FORMULARIO -->
  <h2>Añadir persona</h2>
<div class="menu"></div>
 <button id="btnDescargarRecibos">📄 Exportar PDF</button>
<input id="precio" type="number" placeholder="Precio €" style="width:100px;">
<div class="barra-impresion">

  <select id="ordenSelect">
    <option value="nombre">Ordenar por nombre</option>
    <option value="calle">Ordenar por calle</option>
    <option value="cp">Ordenar por código postal</option>
  </select>

 <button id="btnImprimirRecibos">
  🖨️ Imprimir A4
</button>
</div>
 <button id="btnPendientes" class="btn-filtro">❌ Pendientes</button>
<button id="btnPagados" class="btn-filtro">💳 Pagados</button>
<button id="btnActivos" class="btn-filtro">🟢 Activos</button>
<button id="btnTodos" class="btn-filtro">👥 Todos</button>
<button id="btnIrListado">📄 Listado PDF</button>
<button id="btnIrFiltros">🔍 Filtros avanzados</button>
<button id="btnPapelera">🗑️ Papelera</button>
<button id="btnBackup">💾 Copia de seguridad</button>
<button id="btnBackupParcial">🧪 Crear copia parcial de prueba</button>
<section id="selectorBackupParcial" hidden aria-live="polite">
  <h3>Seleccionar personas para la copia parcial</h3>
  <p>Esta operación solo genera un archivo y no modifica Firebase.</p>
  <div id="listaBackupParcial"></div>
  <button id="btnGenerarBackupParcial">Descargar copia de la selección</button>
  <button id="btnCancelarBackupParcial">Cancelar</button>
  <div id="estadoBackupParcial" role="status" aria-live="polite"></div>
</section>
<button id="btnElegirBackup">📂 Elegir copia para restaurar</button>
<input type="file" id="backupFile" accept=".json,application/json" style="display:none">
<section id="vistaPreviaRestauracion" hidden aria-live="polite">
  <h3>Vista previa de restauración</h3>
  <div id="resumenVistaPrevia"></div>
  <button id="btnCrearCopiaPrevia">💾 Crear copia previa</button>
  <button id="btnEjecutarRestauracion" disabled>⚠️ Ejecutar restauración</button>
  <button id="btnCancelarRestauracion">Cancelar</button>
  <div id="estadoRestauracion" role="status" aria-live="polite"></div>
</section>
<section id="panelPapelera" hidden aria-live="polite">
  <h2>🗑️ Papelera</h2>
  <button id="btnCerrarPapelera">⬅️ Volver a personas</button>
  <div id="estadoPapelera" role="status" aria-live="polite"></div>
  <div id="listaPapelera"></div>
</section>
</div>
  <!-- 📋 LISTA -->
  <h2 id="tituloPersonas">Personas</h2>
  <div id="lista"></div>
<div id="pantallaFiltros" style="display:none; padding:10px;">

  <h2>Filtros</h2>

  <label>Año nacimiento</label>
  <input type="number" id="filtroAnio" placeholder="Ej: 1980">

  <label>Calle</label>
  <input type="text" id="filtroCalle" placeholder="Ej: Canal">

  <label>Nombre / Apellidos</label>
  <input type="text" id="filtroNombre" placeholder="Ej: García">

  <label>Provincia</label>
  <input type="text" id="filtroProvincia" placeholder="Ej: Zaragoza">

  <br><br>

  <button id="btnVerResultados">🔍 Ver resultados</button>
  <button id="btnPdfFiltrado">📄 Generar PDF</button>
  <button id="btnVolverFiltros">⬅️ Volver</button>

  <hr>

  <div id="resultadosFiltros"></div>

</div>

  <!-- 🔥 FIREBASE (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js" integrity="sha384-BkEIW/B4JV9w6pRfBRgZtAcYDk5goH1nUI49rLo8s5PSHgTfgxWBczRVJx+fv5kP" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js" integrity="sha384-LF74FIj8PQKxRVken52qSHntBSVEC6b05H04maSVJibifVGmWz9Ajc23WjrRVSCX" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js" integrity="sha384-96KlrabK9X4T/tq4duY+/4JE60jZAiSs4QVJFwmY30ETT24x2+89B7qmq7O4IETX" crossorigin="anonymous"></script>

  <!-- 🚀 APP -->
 <!-- 🔥 LIBRERÍAS -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" integrity="sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" crossorigin="anonymous"></script>

<!-- 🔥 TU APP -->
<script src="app.js"></script>
<script src="recibos.js"></script>
<script src="filtros.js"></script>
  <div id="modalForm" class="modal hidden">
  <div class="modal-content">

    <h2>➕ Nueva persona</h2>

    <input id="nombre" placeholder="Nombre">
    <input id="apellido1" placeholder="Apellido 1">
    <input id="apellido2" placeholder="Apellido 2">
    <input id="direccion" placeholder="Dirección">
    <input id="poblacion" placeholder="Población">
    <input id="provincia" placeholder="Provincia">
    <input id="cp" placeholder="Código postal">
    <input id="fecha" placeholder="Fecha nacimiento">

    <div class="modal-buttons">
     <button id="btnGuardar" class="btn-save">💾 Guardar</button>
      <button id="btnCancelarFormulario">❌ Cancelar</button>
    </div>

  </div>
</div>
<button id="btnAbrirFormulario" class="fab">➕</button>
<div id="modalForm" class="modal hidden">

  <div class="modal-header">
    <button id="btnCerrarFormularioSecundario">←</button>
    <h2>Nueva persona</h2>
  </div>

  
</div>
<div id="toast" class="toast hidden"></div>
</div>
</body>
</html>
