<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://cdnjs.cloudflare.com; script-src-attr 'none'; connect-src 'self' https://*.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://cofradia-app-28829.firebaseapp.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Listado PDF</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="listing-page">
  <header class="app-header listing-header">
    <div class="header-inner listing-header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">SC</span>
        <div>
          <p class="eyebrow">Listado de personas</p>
          <h1>Cofradía San Cristóbal</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="listing-main">
    <section class="panel listing-card" aria-labelledby="tituloListado">
      <div class="listing-heading">
        <p class="eyebrow">Documentación</p>
        <h2 id="tituloListado">Generar listado PDF</h2>
        <p class="listing-intro">Selecciona cómo quieres ordenar las personas antes de generar el documento.</p>
      </div>

      <div id="listadoEstado" class="listing-status" role="status" aria-live="polite">🔒 Comprobando sesión...</div>

      <div id="listadoControls" class="listing-controls" style="display:none">
        <div class="field">
          <label for="ordenListado">Orden del listado</label>
          <select id="ordenListado">
            <option value="nombre">Nombre</option>
            <option value="calle">Agrupar por calle</option>
            <option value="edad">Edad</option>
            <option value="poblacion">Población</option>
          </select>
        </div>

        <div class="listing-actions">
          <button id="btnGenerarListado" class="btn btn-primary">Generar PDF</button>
          <button id="btnVolverListado" class="btn btn-secondary">← Volver</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 🔥 FIREBASE (igual que en index) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js" integrity="sha384-gNTK1b3nq+NMsDf1ASdhbVEwXj9tjBeobuvcjWGlmIffN9OP+Q0SU9Q10JKPZryT" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js" integrity="sha384-RCX4/afwL4rcvPna7SzxURYLlkH4PeSnyydnrIn/zzZyviOL3A9RZjNPvXunkiFD" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js" integrity="sha384-p62xBRve8PdqGDGASZtZMuHgPsyPcT5VsFwgmz2p4zaFdEtt5ZzNqxK+CLzQS7xP" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" integrity="sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js" integrity="sha384-vuyrTV5nkscLp1knFvt+FIHfKKzmROBq5reruhMRslauj54mW+l2B8b6szMN6lCL" crossorigin="anonymous"></script>
  <!-- 🔥 TU CÓDIGO -->
  <script src="listado.js"></script>

</body>
</html>
